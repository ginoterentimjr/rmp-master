<style>
:root{--tinta:#2A211C;--corpo:#4A3F37;--meta:#8D8377;--creme:#F6F2EC;--card:#FFFFFF;--card2:#FAF7F1;--linha:#E2D9CD;
--lar:#E5662C;--larc:#FFF1E8;--escuro:#1B1512;--ouro:#C9A24D;--pagl:#B04A1C;--tom:#2F6B6F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--creme);color:var(--corpo);font:400 16px/1.55 Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
b,strong{color:var(--tinta);font-weight:600}
/* ── portão ── */
#gate{min-height:100vh;min-height:100dvh;background:var(--escuro);color:#F3E9DC;display:flex;align-items:center;justify-content:center;padding:24px 16px;position:relative;overflow:hidden}
#gate .hex{position:absolute;inset:0;opacity:.18;pointer-events:none}

const TOMS = {"abertura": "#4A3F37", "preparacao": "#1F7A7A", "avaliacao": "#9A5B33", "u1": "#2F6B6F", "u2": "#B5781E", "u3": "#35608F", "u4": "#7A4E6D", "u5": "#4E6E8E", "u6": "#8E3B50", "practicum": "#5E7D52"};
let C = null, KEY = null;
const $ = (s, r = document) => r.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const semAc = s => s.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();
const norm = s => s.normalize("NFKD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const ler = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const gravar = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const HEX = '<svg class="hex" width="100%" height="100%"><rect width="100%" height="100%" fill="url(#hx)"/></svg>';

async function abrir(codigo) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(codigo)), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(PAY.s), iterations: PAY.n, hash: "SHA-256" }, base,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAY.i) }, k, b64(PAY.c));
  KEY = k;
  return JSON.parse(new TextDecoder().decode(pt));
}

// ── portão ──
async function tentar(codigo, silencioso) {
  const btn = $("#entrar"); btn.disabled = true; btn.textContent = "Abrindo…";
  try {
    C = await abrir(codigo);
    gravar("rmp-codigo", codigo);
    $("#gate").remove(); $("#app").hidden = false;
    montarIndice(); rota();
  } catch (e) {
    if (!silencioso) $("#erro").textContent = "Código não reconhecido. Confira com o facilitador e tente de novo.";
    btn.disabled = false; btn.textContent = "Entrar";
  }
}
$("#gform").addEventListener("submit", e => { e.preventDefault(); const v = $("#cod").value; if (v.trim()) tentar(v); });
if (!window.crypto || !crypto.subtle) $("#erro").textContent = "Abra este endereço em https, no navegador do celular.";
else { const salvo = ler("rmp-codigo"); if (salvo) tentar(salvo, true); }

// ── rotas ──
const ORDEM = ["capa", "sumario", "p1", "p2", "p3", "p4", "p5", "p6", "p7", "p8", "p9", "fim"];
function cap(p) { return C.caps[p - 1]; }
function titulo(id) {
  if (id === "capa") return "Capa";
  if (id === "sumario") return "Sumário";
  if (id === "fim") return "Encerramento";
  const c = cap(+id.slice(1)); return c.p + " · " + c.t;
}
function tomDe(id) { return id[0] === "p" ? TOMS[cap(+id.slice(1)).u] : TOMS.abertura; }
function rota() {
  let id = location.hash.replace("#", "") || "capa";
  if (/^p\d$/.test(id) === false && !ORDEM.includes(id)) id = "capa";
  const i = ORDEM.indexOf(id);
  document.documentElement.style.setProperty("--tom", tomDe(id));
  const v = $("#view");
  v.innerHTML = ({ capa: vCapa, sumario: vSumario, fim: vFim })[id]?.() ?? vPagina(+id.slice(1));
  window.scrollTo(0, 0);
  $("#pgI").textContent = id[0] === "p" ? id.slice(1) : (id === "capa" ? "C" : id === "fim" ? "F" : "S");
  $("#pgT").textContent = id[0] === "p" ? "Página " + id.slice(1) : titulo(id);
  const a = ORDEM[i - 1], p = ORDEM[i + 1];
  $("#ant").disabled = !a; $("#prox").disabled = !p;
  if (a) { $("#antT").textContent = titulo(a); $("#ant").onclick = () => location.hash = a; }
  if (p) { $("#proxT").textContent = titulo(p); $("#prox").onclick = () => location.hash = p; }
  ligar(id);
}
window.addEventListener("hashchange", () => { if (C) rota(); });

// ── índice ──
function montarIndice() {
  const g = $("#grade");
  let h = `<button class="cl" data-go="capa">C<small>Capa</small></button><button class="cl" data-go="sumario">S<small>Sumário</small></button>`;
  C.caps.forEach(c => h += `<button style="background:${TOMS[c.u]}" data-go="p${c.p}">${c.p}<small>${esc(c.t)}</small></button>`);
  h += `<button class="cl" data-go="fim">F<small>Encerramento</small></button>`;
  g.innerHTML = h;
  g.onclick = e => { const b = e.target.closest("[data-go]"); if (b) { location.hash = b.dataset.go; fecharInd(); } };
  $("#abreInd").onclick = $("#abreInd2").onclick = () => $("#ind").classList.add("on");
  $("#ind").onclick = e => { if (e.target.id === "ind") fecharInd(); };
}
function fecharInd() { $("#ind").classList.remove("on"); }
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2200); }

// ── componentes ──
const disco = (ic, cor, px) => `<span class="disco" style="${cor ? "background:" + cor + ";" : ""}${px ? "width:" + px + "px;height:" + px + "px" : ""}"><img src="${ic}" alt=""></span>`;
function cabec(c) {
  const eb = `<div class="ebrow"><span>${esc(c.eb)}</span><hr><div class="selo"><i><img src="${C.un[c.u]}" alt=""></i>${esc(c.rot)}</div></div>`;
  const h = `<h1 class="tt">${esc(c.h[0])}<em>${esc(c.h[1])}</em></h1>`;
  if (c.lar) return `<div class="lar-hero">${eb}${h}<p class="lede">${esc(c.lede)}</p></div>`;
  return `<div class="sec">${eb}${h}${c.lede ? `<p class="lede">${esc(c.lede)}</p>` : ""}</div>`;
}
const nota = n => `<div class="note"><b>${esc(n[0])}</b> ${esc(n[1])}</div>`;
function anot(p) {
  const v = ler("rmp-nota-" + p) || "";
  return `<div class="notas"><label>${disco(C.ui["notebook-pen"], null, 26)}Minhas anotações · página ${p}</label>
  <textarea data-nota="${p}" placeholder="O que você quer guardar desta página?">${esc(v)}</textarea><small id="st${p}">Fica salvo neste aparelho.</small></div>`;
}
const rodape = p => `<div class="rod"><span>RMP Master Certification · Apostila do Participante</span><b>${p === "S" ? "Sumário" : String(p).padStart(2, "0")}</b></div>`;

function caminho(atual, refs) {
  const K = C.caminho, rf = refs || K.refs;
  let h = `<div class="cam${refs ? " ref" : ""}">`;
  K.grupos.forEach(([a, b, rot]) => {
    h += `<div class="cam-g">${esc(rot)}</div>`;
    for (let i = a; i <= b; i++) {
      const [k, num, nome] = K.est[i], st = i < atual ? "feito" : i === atual ? "atual" : "prox";
      h += `<div class="cam-e ${st}"><span class="cam-c" style="--c:${TOMS[k]}">${esc(num)}</span><div><b>${esc(nome)}</b><small>${esc(rf[i])}</small></div></div>`;
    }
  });
  const L = K.legenda;
  return h + `<div class="cam-leg"><span><i style="background:var(--tinta)"></i>${esc(L[0])}</span><span><i style="background:var(--tinta);box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--lar)"></i>${esc(L[1])}</span><span><i style="border:1.4px solid var(--meta)"></i>${esc(L[2])}</span></div></div>`;
}
// ── capa, sumário, fim ──
function vCapa() {
  return `<section class="capa">${HEX}<div class="wrap">
  <div class="lock" style="display:flex;align-items:center;gap:12px"><img src="${$(".bar img").src}" alt="" style="width:46px;height:46px"><div><b style="color:#fff;letter-spacing:.06em">GINO TERENTIM</b><span style="display:block;font-size:10px;letter-spacing:.22em;color:var(--ouro)">RETHINKING LEARNING</span></div></div>
  <div class="meta-c">RMP Master Certification · Itaú Unibanco · Transformation Consultancy</div>
  <div style="margin-top:26px"><span class="pill">${esc(C.capa.pill)}</span></div>
  <div class="eb">Reiss Motivation Profile®</div>
  <h1>Apostila do<br>Participante</h1>
  <p>${esc(C.capa.lede)}</p>
  <p class="nt">${esc(C.capa.nota)}</p>
  <a class="btn" href="#sumario" style="display:inline-block;text-decoration:none">Abrir a apostila</a>
  </div></section>`;
}
function vSumario() {
  let tec = "", lista = "";
  C.caps.forEach(c => {
    tec += `<button style="background:${TOMS[c.u]}" data-go="p${c.p}">${c.p}<small>${esc(c.t)}</small></button>`;
    lista += `<a class="card cap" href="#p${c.p}">${disco(C.un[c.u], TOMS[c.u])}<div><div class="n">${String(c.p).padStart(2, "0")}</div><b>${esc(c.t)}</b></div><span class="seta" style="font-size:12.5px">página ${String(c.p).padStart(2, "0")} ›</span></a>`;
  });
  return `<div class="wrap"><div class="hero-esc">${HEX}<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div class="eb">SUMÁRIO E CAMINHO</div><div class="selo" style="border-color:var(--ouro);color:var(--ouro)"><i style="background:rgba(255,255,255,.12)"><img src="${C.un.abertura}" alt=""></i>ABERTURA</div></div>
  <h1>${esc(C.sumario.h[0])}<em>${esc(C.sumario.h[1])}</em></h1><p>${esc(C.sumario.lede)}</p></div>${caminho(1)}
  <div class="kicker">Ir direto à página</div><div class="teclado" id="tec">${tec}</div>
  <div class="kicker">Os nove capítulos</div><div class="pilha">${lista}</div>
  ${rodape("S")}</div>`;
}
function vFim() {
  const f = C.fim;
  return `<section class="capa">${HEX}<div class="wrap">
  <span class="pill ouro">${esc(f.pill)}</span>
  <p class="frase">${esc(f.frase[0])}<em>${esc(f.frase[1])}</em>${esc(f.frase[2])}</p>
  <img class="sig" src="${C.assinatura}" alt="Assinatura de Gino Terentim"><div class="regra-o"></div>
  <div style="color:#fff;font-weight:700;letter-spacing:.08em">GINO TERENTIM</div>
  <div style="font-size:10.5px;letter-spacing:.22em;color:var(--ouro)">RETHINKING LEARNING</div>
  <div style="margin-top:8px;font-size:14px;color:#CFC3B5">${esc(f.contato)}</div>
  <div class="acoes"><button class="btn" id="copiar">Copiar minhas anotações</button><button class="btn sec" id="pdf">Baixar a apostila em PDF</button></div>
  </div></section>`;
}

// ── páginas ──
function vPagina(p) {
  const c = cap(p); if (!c) return vCapa();
  let h = `<div class="wrap">${cabec(c)}`;
  h += ({ 1: p1, 2: p2, 3: p3, 4: p4, 5: p5, 6: p6, 7: p7, 8: p8, 9: p9 })[p](c);
  return h + anot(p) + rodape(p) + "</div>";
}
function p1(c) {
  return `<div class="ctl"><div class="busca"><i><img src="${C.ui.search}" alt=""></i><input id="bd" type="search" placeholder="Buscar desejo ou meta universal"></div>
  <div class="seg" id="modo1"><button class="on" data-m="ler">Ler</button><button data-m="estudo">Modo estudo</button></div></div>
  <div class="pilha" id="lista1"></div>`;
}
function desejos1(f, estudo) {
  const q = semAc(f || "");
  const it = C.desejos.filter(d => !q || semAc(d.n + " " + d.df + " " + d.meta).includes(q));
  if (!it.length) return `<div class="vazio">Nenhum desejo encontrado.</div>`;
  return it.map(d => `<div class="card des ${estudo ? "oculto" : ""}" data-flip>${disco(d.ic, TOMS.u1)}<div style="flex:1">
   <h3>${esc(d.n)}</h3><div class="revela"><p>${esc(d.df)}</p><span class="meta-u">Meta universal · ${esc(d.meta)}</span></div>
   <span class="dica">Toque para ver a definição e a meta universal.</span></div></div>`).join("");
}
function p2(c) {
  const itens = c.itens.map((x, i) => `<div class="card num"><span class="k">0${i + 1}</span><div><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div></div>`).join("");
  const linhas = c.itens.map((x, i) => `<div class="linha"><span>${esc(x[0])}</span><span class="sn" data-i="${i}"><button data-v="s">Sim</button><button data-v="n">Não</button></span></div>`).join("");
  return `<div class="pilha">${itens}</div>${c.notas.map(nota).join("")}
  <div class="kicker">Conferir um candidato pelos cinco critérios</div>
  <div class="card teste acc"><div class="busca" style="margin-bottom:6px"><i><img src="${C.ui["clipboard-check"]}" alt=""></i><input id="cand" placeholder="Candidato, por exemplo: reconhecimento"></div>
  ${linhas}<div class="veredito" id="ver">Responda aos cinco critérios.</div></div>`;
}
function p3(c) {
  const cores = { Forte: TOMS.u3, Médio: "#A79C90", Fraco: "#7F9BB8" };
  const fx = c.faixas.map(f => `<div class="fx"><div class="tag" style="background:${cores[f[0]]}">${esc(f[0])}<small>${esc(f[1])}</small></div><p>${esc(f[2])}</p></div>`).join("");
  const ch = c.presets.map(([n, v]) => `<button data-v="${v}">${esc(n)} ${v > 0 ? "+" : ""}${v.toFixed(2).replace(".", ",")}</button>`).join("");
  return `<div class="faixas card">${fx}</div>
  <div class="kicker">Régua de intensidade</div>
  <div class="card regua acc"><div><span class="valor" id="rv">0,00</span><span class="band" id="rb">Médio</span></div>
  <div class="trilho"><span class="mk" style="left:29%"></span><span class="mk" style="left:71%"></span></div>
  <input type="range" id="rr" min="-2" max="2" step="0.01" value="0" aria-label="Escore">
  <div class="escala"><span>−2</span><span>−0,84</span><span>0</span><span>+0,84</span><span>+2</span></div>
  <div class="leitura" id="rl"></div><div class="alerta" id="ra" hidden></div>
  <div class="chips" style="margin:14px 0 0;padding:0">${ch}</div></div>
  ${c.notas.map(nota).join("")}`;
}
function p4(c) {
  return `<div class="ctl"><div class="busca"><i><img src="${C.ui.search}" alt=""></i><input id="bt" type="search" placeholder="Traço ou desejo, por exemplo: organizado"></div></div>
  <div class="card" id="lista4" style="padding:4px 16px"></div>${c.notas.map(nota).join("")}`;
}
function tracos(f) {
  const q = semAc(f || "");
  const marca = s => { if (!q) return esc(s); const i = semAc(s).indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length)); };
  const it = C.desejos.filter(d => !q || semAc(d.n + " " + d.fraco + " " + d.forte).includes(q));
  if (!it.length) return `<div class="vazio">Nenhum traço encontrado. Tente outra palavra.</div>`;
  return it.map(d => `<div class="tr">${disco(d.ic, TOMS.u3)}<div><h3>${marca(d.n)}</h3><div class="par">
   <div><small>TRAÇO DO FRACO</small><b>${marca(d.fraco)}</b></div><div><small>TRAÇO DO FORTE</small><b>${marca(d.forte)}</b></div></div></div></div>`).join("");
}
function p5(c) {
  const s = c.slabs.map(x => `<div class="card acc slab"><div class="lab"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div><p>${esc(x[2])}</p></div>`).join("");
  return `${caminho(c.caminho)}<div class="pilha">${s}</div>${c.notas.map(nota).join("")}`;
}
function p6(c) {
  return `<div class="pilha">${c.itens.map((x, i) => `<div class="card num"><span class="k">0${i + 1}</span><div><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div></div>`).join("")}</div>`;
}
function p7(c) {
  return `<div class="ctl"><div class="seg" id="modo7"><button class="on" data-m="ler">Ler</button><button data-m="rev">Revisar</button></div></div><div id="lista7"></div>`;
}
const PR = n => C.principios.find(x => x.n === n);
function principiosLer() {
  return `<div class="pilha">` + C.principios.map(x => `<div class="card pr"><span class="rom">${x.n}</span><p>${esc(x.t)}</p></div>`).join("") + "</div>";
}
let REV = { ord: [], i: 0, aberto: false };
function principiosRev() {
  if (!REV.ord.length) REV.ord = C.principios.map(x => x.n);
  const n = REV.ord[REV.i];
  return `<div class="card cartao acc" id="cart7"><div class="rom">${n}</div>
  ${REV.aberto ? `<p>${esc(PR(n).t)}</p>` : `<span class="toque">Toque para ver o enunciado.</span>`}</div>
  <div class="revnav"><button class="btn sec" id="r7a">‹</button><span style="font-size:13.5px;color:var(--meta)">${REV.i + 1} de ${REV.ord.length}</span>
  <button class="btn sec" id="r7e">Embaralhar</button><button class="btn sec" id="r7p">›</button></div>`;
}
function p8(c) {
  const r = c.regras.map(x => `<div class="regra">${disco(C.ui.check, null)}<p><b>${esc(x[0])}</b> ${esc(x[1])}</p></div>`).join("");
  return `<div class="card pilha">${r}</div>`;
}
function p9(c) {
  const ev = c.agenda.map(x => `<div class="ev"><b>${esc(x[0])}</b><p>${esc(x[1])}</p><span>${esc(x[2])}</span></div>`).join("");
  return `${caminho(c.caminho, c.refs)}<div class="kicker">Quando · O quê · Entregável</div><div class="card"><div class="linha-t">${ev}</div></div>${c.notas.map(nota).join("")}`;
}

// ── comportamento ──
function ligar(id) {
  document.querySelectorAll("[data-nota]").forEach(t => {
    let tm; t.addEventListener("input", () => { clearTimeout(tm); tm = setTimeout(() => {
      const ok = gravar("rmp-nota-" + t.dataset.nota, t.value);
      const st = $("#st" + t.dataset.nota); if (st) st.textContent = ok ? "Salvo neste aparelho." : "Não foi possível salvar neste navegador.";
    }, 400); });
  });
  const tec = $("#tec"); if (tec) tec.onclick = e => { const b = e.target.closest("[data-go]"); if (b) location.hash = b.dataset.go; };
  if (id === "p1") {
    let estudo = false; const L = $("#lista1"); const pinta = () => L.innerHTML = desejos1($("#bd").value, estudo); pinta();
    $("#bd").oninput = pinta;
    $("#modo1").onclick = e => { const b = e.target.closest("button"); if (!b) return; estudo = b.dataset.m === "estudo";
      $("#modo1").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); pinta(); };
    L.onclick = e => { const c = e.target.closest("[data-flip]"); if (c && estudo) c.classList.toggle("oculto"); };
  }
  if (id === "p2") {
    const R = [null, null, null, null, null], nomes = cap(2).itens.map(x => x[0]);
    const ver = () => {
      const v = $("#ver"), cand = $("#cand").value.trim() || "O candidato";
      v.className = "veredito";
      if (R.some(x => x === null)) { v.textContent = "Responda aos cinco critérios."; return; }
      const falhas = nomes.filter((n, i) => !R[i]);
      if (!falhas.length) { v.classList.add("ok"); v.innerHTML = `<b>${esc(cand)}</b> passa nos cinco critérios.`; }
      else { v.classList.add("nok"); v.innerHTML = `<b>${esc(cand)}</b> não passa em: ${falhas.map(esc).join(", ")}.`; }
    };
    document.querySelectorAll(".sn").forEach(s => s.onclick = e => { const b = e.target.closest("button"); if (!b) return;
      const i = +s.dataset.i; R[i] = b.dataset.v === "s";
      s.querySelectorAll("button").forEach(x => x.className = x === b ? (R[i] ? "sim" : "nao") : ""); ver(); });
    $("#cand").oninput = ver;
  }
  if (id === "p3") {
    const r = $("#rr"), f = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2).replace(".", ",");
    const pinta = () => {
      const v = +r.value, ab = Math.abs(v);
      const b = v > 0.84 ? "Forte" : v < -0.84 ? "Fraco" : "Médio";
      const cor = { Forte: TOMS.u3, Médio: "#A79C90", Fraco: "#7F9BB8" }[b];
      $("#rv").textContent = f(v); const rb = $("#rb"); rb.textContent = b; rb.style.background = cor;
      $("#rl").innerHTML = "<b>Como ler.</b> " + esc(cap(3).faixas.find(x => x[0] === b)[2]);
      const perto = ab >= 0.74 && ab <= 0.94;
      $("#ra").hidden = !perto;
      if (perto) $("#ra").textContent = "Escore perto do limite pede linguagem cuidadosa na devolutiva.";
    };
    r.oninput = pinta; pinta();
    document.querySelectorAll(".regua .chips button").forEach(b => b.onclick = () => { r.value = b.dataset.v; pinta(); });
  }
  if (id === "p4") { const L = $("#lista4"), pinta = () => L.innerHTML = tracos($("#bt").value); pinta(); $("#bt").oninput = pinta; }
  if (id === "p7") {
    let modo = "ler"; const L = $("#lista7");
    const pinta = () => {
      L.innerHTML = modo === "ler" ? principiosLer() : principiosRev();
      if (modo === "rev") {
        $("#cart7").onclick = () => { REV.aberto = !REV.aberto; pinta(); };
        $("#r7a").onclick = () => { REV.i = (REV.i - 1 + REV.ord.length) % REV.ord.length; REV.aberto = false; pinta(); };
        $("#r7p").onclick = () => { REV.i = (REV.i + 1) % REV.ord.length; REV.aberto = false; pinta(); };
        $("#r7e").onclick = () => { for (let i = REV.ord.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [REV.ord[i], REV.ord[j]] = [REV.ord[j], REV.ord[i]]; } REV.i = 0; REV.aberto = false; pinta(); };
      }
    };
    $("#modo7").onclick = e => { const b = e.target.closest("button"); if (!b) return; modo = b.dataset.m; REV = { ord: [], i: 0, aberto: false };
      $("#modo7").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); pinta(); };
    pinta();
  }
  if (id === "fim") {
    $("#copiar").onclick = async () => {
      let t = "Minhas anotações · Apostila RMP Master\n";
      C.caps.forEach(c => { const v = ler("rmp-nota-" + c.p); if (v && v.trim()) t += `\nPágina ${c.p} · ${c.t}\n${v.trim()}\n`; });
      if (t.split("\n").length < 3) { toast("Ainda não há anotações neste aparelho."); return; }
      try { if (navigator.share) await navigator.share({ title: "Minhas anotações", text: t }); else { await navigator.clipboard.writeText(t); toast("Anotações copiadas."); } }
      catch (e) { try { await navigator.clipboard.writeText(t); toast("Anotações copiadas."); } catch (e2) { toast("Não foi possível copiar neste navegador."); } }
    };
    $("#pdf").onclick = async () => {
      const b = $("#pdf"); b.textContent = "Preparando o PDF…"; b.disabled = true;
      try {
        const r = await fetch("apostila.bin", { cache: "no-store" }); const buf = new Uint8Array(await r.arrayBuffer());
        const pdf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, KEY, buf.slice(12));
        const url = URL.createObjectURL(new Blob([pdf], { type: "application/pdf" }));
        const a = document.createElement("a"); a.href = url; a.download = "Apostila_RMP_Master.pdf"; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000); b.textContent = "Baixar a apostila em PDF";
      } catch (e) { b.textContent = "PDF indisponível no momento"; }
      b.disabled = false;
    };
  }
